name: Deploy Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Web PCK with Godot 4.7.2
        run: |
          set -euo pipefail
          GODOT_VER="4.7.2-stable"
          TP_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TP_DIR"
          curl -fSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp
          chmod +x "/tmp/Godot_v${GODOT_VER}_linux.x86_64"
          curl -fSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -q -o /tmp/templates.tpz "templates/web_nothreads_release.zip" "templates/web_nothreads_debug.zip" -d /tmp
          mv /tmp/templates/web_nothreads_*.zip "$TP_DIR/"
          "/tmp/Godot_v${GODOT_VER}_linux.x86_64" --headless --path . --import || true
          for s in scripts/data/*.gd scripts/autoload/*.gd scripts/world/*.gd scripts/ui/*.gd; do
            "/tmp/Godot_v${GODOT_VER}_linux.x86_64" --headless --path . --check-only --script "res://$s"
          done
          BOOT_LOG=$(mktemp)
          "/tmp/Godot_v${GODOT_VER}_linux.x86_64" --headless --path . --quit-after 10 2>&1 | tee "$BOOT_LOG"
          if grep -E "SCRIPT ERROR|Parse Error" "$BOOT_LOG"; then
            echo "Headless boot test detected script error!"
            exit 1
          fi
          "/tmp/Godot_v${GODOT_VER}_linux.x86_64" --headless --path . --export-release "Web" build/web/index.html
          RUN_ID="${GITHUB_RUN_NUMBER:-1}" python3 - << 'PY'
          import os, re
          from pathlib import Path
          proj = Path("project.godot").read_text(encoding="utf-8")
          m = re.search(r'config/version="([^"]+)"', proj)
          base_ver = f"v{m.group(1)}" if m else "v1.6.2"
          run_id = os.environ.get("RUN_ID", "1")
          ver = f"{base_ver}.{run_id}"
          html_p = Path("build/web/index.html")
          html_txt = html_p.read_text(encoding="utf-8")
          html_txt = re.sub(r'src="index\.js[^"]*"', f'src="index.js?v={ver}"', html_txt)
          html_p.write_text(html_txt, encoding="utf-8")
          js_p = Path("build/web/index.js")
          js_txt = js_p.read_text(encoding="utf-8")
          js_txt = re.sub(
              r"return fetch\(file.*?\)\.then",
              f"return fetch(file+((file.endsWith('.pck')||file.endsWith('.wasm'))?'?v={ver}' :''), {{cache:'no-cache'}}).then",
              js_txt,
          )
          js_p.write_text(js_txt, encoding="utf-8")
          print("Cache-busting applied for", ver)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
